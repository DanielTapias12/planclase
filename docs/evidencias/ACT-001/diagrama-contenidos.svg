  <!-- Mod 3 top center: (1330, 210) -->
  <path d="M 800 160 L 800 185 L 270 185 L 270 210" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linejoin="round" />
  <path d="M 800 160 L 800 210" stroke="#94a3b8" stroke-width="2.5" fill="none" />
  <path d="M 800 160 L 800 185 L 1330 185 L 1330 210" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linejoin="round" />

